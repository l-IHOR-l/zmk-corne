# corne_left is the split central: it owns BLE profiles and sends keyboard HID.
# Prospector status advertisements must be enabled only on this side.

# Uncomment to enable the Corne RGB underglow on the left half.
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment to enable the Corne OLED display on the left half.
# CONFIG_ZMK_DISPLAY=y

CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="MyKeyboard"

# Ask the central to retrieve the right-half battery level for the scanner.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Match the Corne topology so the scanner renders both battery slots correctly.
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="LEFT"
