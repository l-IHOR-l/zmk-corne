# corne_right is the BLE peripheral. It must not enable Prospector status
# advertisements: with ZMK v0.3 the required HID modifier event is linked only
# into the central firmware.

# Uncomment to enable the Corne RGB underglow on the right half.
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment to enable the Corne OLED display on the right half.
# CONFIG_ZMK_DISPLAY=y
